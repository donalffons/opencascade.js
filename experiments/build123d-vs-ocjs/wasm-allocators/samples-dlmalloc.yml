# Minimal samples-only OCJS build — dlmalloc variant
#
# Sibling of samples-emmalloc.yml and samples-mimalloc.yml. The three YAMLs
# are byte-identical except for the trailing -sMALLOC=... flag (and an
# INITIAL_MEMORY bump on the mimalloc variant per Emscripten guidance).
#
# Bindings list mirrors exactly what experiments/build123d-vs-ocjs/ocjs/samples.mjs
# instantiates with `using` declarations + every method called on those handles.
# NCollection_* containers are auto-included via build/ncollection-manifest.json
# at link time and do not need to be listed.
#
# F12 wasm allocator comparison sample.

mainBuild:
  name: opencascade_single.js
  bindings:
    # gp / Geom / topology / enums used as value types or via `new`
    - symbol: gp_Pnt
    - symbol: gp_Dir
    - symbol: gp_Ax2
    - symbol: Geom_Circle
    - symbol: TopoDS_Shape
    - symbol: TopoDS_Edge
    - symbol: TopoDS_Wire
    - symbol: TopoDS_Face
    - symbol: TopoDS
    - symbol: TopExp_Explorer
    - symbol: TopAbs_ShapeEnum
    - symbol: TopLoc_Location
    - symbol: GeomAbs_Shape
    - symbol: ChFi3d_FilletShape
    - symbol: Message_ProgressRange
    - symbol: Poly_Triangulation
    - symbol: BRep_Tool
    # Foundation base classes — embind requires all ancestors of any registered class
    - symbol: Standard_Transient
    - symbol: Geom_Geometry
    - symbol: Geom_Curve
    - symbol: Geom_Conic
    # Algorithm base classes (transitively required by embind constructor lookup)
    - symbol: BRepBuilderAPI_MakeShape
    - symbol: BRepBuilderAPI_Command
    - symbol: BRepPrimAPI_MakeOneAxis
    - symbol: BRepPrimAPI_MakeSweep
    - symbol: BRepAlgoAPI_BuilderAlgo
    - symbol: BRepAlgoAPI_BooleanOperation
    - symbol: BRepAlgoAPI_Algo
    - symbol: BRepBuilderAPI_ModifyShape
    - symbol: BRep_Builder
    - symbol: TopoDS_Builder
    - symbol: BRepFilletAPI_LocalOperation
    - symbol: BRepMesh_DiscretRoot
    # R5 multi-tool form: SetArguments + SetTools take NCollection_List_TopoDS_Shape;
    # the canonical container is auto-included via the NCollection manifest, but its
    # base class must be explicitly registered so embind can resolve the inheritance chain.
    - symbol: NCollection_BaseList
    # Algorithms touched by the 10 samples
    - symbol: BRepPrimAPI_MakeBox
    - symbol: BRepPrimAPI_MakeCylinder
    - symbol: BRepBuilderAPI_MakeEdge
    - symbol: BRepBuilderAPI_MakeWire
    - symbol: BRepAlgoAPI_Fuse
    - symbol: BRepAlgoAPI_Cut
    - symbol: BRepOffsetAPI_ThruSections
    - symbol: BRepOffsetAPI_MakePipeShell
    - symbol: BRepOffsetAPI_MakeFilling
    - symbol: BRepFilletAPI_MakeFillet
    - symbol: BRepMesh_IncrementalMesh
  emccFlags:
    # Verbatim copy of build-configs/full.yml::emccFlags except:
    # - USE_FREETYPE removed (the 10 samples do not touch font geometry)
    # - -sMALLOC=dlmalloc appended at the end (this variant)
    - -fwasm-exceptions
    - -sEXPORT_ES6=1
    - -sMODULARIZE
    - -sALLOW_MEMORY_GROWTH=1
    - -sINITIAL_MEMORY=100MB
    - -sMAXIMUM_MEMORY=4GB
    - -sEXPORTED_RUNTIME_METHODS=["FS","getExceptionMessage","incrementExceptionRefcount","decrementExceptionRefcount"]
    - --no-entry
    - --emit-symbol-map
    - -sSTACK_SIZE=8388608
    - -sWASM_BIGINT
    - -sEVAL_CTORS=2
    - -msimd128
    - -O3
    - -sMALLOC=dlmalloc
