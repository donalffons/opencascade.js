name: reproducibility

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: false
      source_date_epoch:
        type: string
        required: false
      version:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.metadata.outputs.full_sha }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_EPOCH: ${{ inputs.source_date_epoch }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          full_sha="${EXPECTED_SHA:-$GITHUB_SHA}"
          source_date_epoch="${EXPECTED_EPOCH:-$(git show -s --format=%ct "$full_sha")}"
          version="${EXPECTED_VERSION:-$(node -p "require('./package.json').version")}"
          git cat-file -e "$full_sha^{commit}"
          {
            echo "full_sha=$full_sha"
            echo "source_date_epoch=$source_date_epoch"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  cold-build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build isolated canonical image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: final-single
          platforms: linux/arm64
          load: true
          no-cache: true
          tags: ocjs:repro-${{ matrix.copy }}
          build-args: |
            SOURCE_DATE_EPOCH=0
            REVISION=${{ needs.prepare.outputs.full_sha }}
            OCJS_SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }}
            VERSION=${{ needs.prepare.outputs.version }}
          provenance: false
          sbom: false

      - name: Runtime smoke and exact artifact ledger
        env:
          OCJS_E2E_BUILD_CONFIG: build-configs/full.yml
          OCJS_E2E_IMAGE: ocjs:repro-${{ matrix.copy }}
          OCJS_E2E_OUTPUT_DIR: ${{ runner.temp }}/output
          OCJS_E2E_STAGE: final-single
          OCJS_EXPECTED_SHA: ${{ needs.prepare.outputs.full_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          scripts/docker-e2e-validate.sh
          node scripts/package-candidate.mjs \
            --write-ledger "$RUNNER_TEMP/output" "$RUNNER_TEMP/ledger.json"

      - name: Upload isolated result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducibility-${{ matrix.copy }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ledger.json
            ${{ runner.temp }}/output/*
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [prepare, cold-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducibility-a-${{ github.run_id }}
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducibility-b-${{ github.run_id }}
          path: ${{ runner.temp }}/b
      - name: Require byte-identical canonical artifacts
        run: |
          node scripts/package-candidate.mjs \
            --compare-ledgers \
            "$RUNNER_TEMP/a/ledger.json" \
            "$RUNNER_TEMP/b/ledger.json"
